<style>*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1b2a4a;background:#f3efe2;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#app.flyv{max-width:none;position:relative}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none}
.wal{margin-left:auto;background:#1b2a4a;color:#ffd166;font-weight:800;padding:6px 14px;border-radius:99px;font-variant-numeric:tabular-nums;font-size:18px}
.wal.bump{animation:bump .35s}@keyframes bump{50%{transform:scale(1.18)}}
.chip{background:#fff;border:2px solid #1b2a4a22;border-radius:99px;padding:4px 11px;font-weight:700;font-size:14px}.rk{color:#b0157a}
.mute,.x{width:40px;height:40px;border-radius:12px;font-size:20px;background:#fff;border:2px solid #1b2a4a22}
.mapv .wal{margin-left:0}.mapv .mute{margin-left:auto}
.mapw{flex:1;min-height:0;display:flex;justify-content:center}.mapsvg{height:100%;max-width:100%;border-radius:14px}
.rt{stroke:#b0157a;stroke-width:4;stroke-dasharray:9 7}.rt.off{stroke:#a89f88;opacity:.5}.rt.sc{stroke:#1ca3ec}
.nd{fill:#fff;stroke:#1b2a4a;stroke-width:3}.nd.mission{fill:#fff4d6}.nd.hangar,.nd.gig{fill:#e3f3ff}.nd.check{fill:#ffe1ef;stroke:#b0157a}.nd.bonus{fill:#dff7ea}
.nd.cl{fill:#cfeedd;stroke:#1f8a55}.nd.lk{fill:#e2dccb;stroke:#a89f88}.nd.nx{stroke:#ff6b35;stroke-width:5;animation:np 1.2s infinite}@keyframes np{50%{stroke-width:9}}
.node{cursor:pointer}.node:hover .nd{filter:brightness(.95)}
.ni{font-size:22px;text-anchor:middle}.nl{font-size:11px;font-weight:800;text-anchor:middle;fill:#1b2a4a;paint-order:stroke;stroke:#f4eedb;stroke-width:4}.ns{font-size:12px;text-anchor:middle;fill:#e09a00;paint-order:stroke;stroke:#f4eedb;stroke-width:3}
.ml{font-size:12px;font-weight:800;letter-spacing:2px;fill:#a89f88}.ml.water{fill:#5b9bbd}.ml.blue{fill:#2a6fdb;font-size:9px;letter-spacing:1px}.ml.mag{fill:#b0157a}
.tokb{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.goal{flex:none;padding:8px 14px 14px;font-size:14px;text-align:center}.cod{display:inline-block;margin-left:8px;color:#b0157a;font-weight:700}
.note{text-align:center;font-size:12px;opacity:.6;padding-bottom:6px}
.rt2 .fp{flex:1;height:10px;background:#1b2a4a1a;border-radius:9px;position:relative}.fp i{display:block;height:100%;background:#b0157a;border-radius:9px;transition:width .4s}.fp b{position:absolute;top:-10px;transform:translateX(-50%);transition:left .4s;font-size:18px}
.rt2 .wal{margin-left:0}
.body{flex:1;overflow:auto;padding:8px 18px 140px;display:flex;flex-direction:column;gap:16px}
.hud{background:#0f1b33;color:#e6f1ff;border-radius:16px;padding:16px 18px;border:2px solid #2c4a7a;box-shadow:inset 0 0 0 1px #000}
.hh{display:flex;justify-content:space-between;font:700 12px/1 ui-monospace,Menlo,monospace;color:#5ef2c0;letter-spacing:1px;margin-bottom:10px}
.combo{color:#ffd166}.story{color:#9fb3d1;font-size:15px;margin-bottom:6px}.prompt{font-size:22px;line-height:1.25}.prompt.sm{font-size:19px}
.opts{display:grid;gap:10px}.opts.two{grid-template-columns:1fr 1fr}
.opt{background:#fff;border:2px solid #1b2a4a33;border-bottom-width:4px;border-radius:14px;padding:15px;font-weight:700;font-size:17px;text-align:left;min-height:56px}
.opt.on{border-color:#1ca3ec;background:#e3f3ff}.opt.ok{border-color:#1f8a55;background:#d6f5e4}.opt.bad{border-color:#d1435b;background:#fde2e6}
.abc{display:flex;gap:12px;align-items:center}.abc b{flex:none;width:30px;height:30px;border-radius:8px;background:#1b2a4a;color:#fff;display:grid;place-items:center}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pairs>div{display:grid;gap:10px;align-content:start}.pr{font-size:15px;text-align:center}.pr:disabled{opacity:.5}
.numw{display:flex;gap:10px;align-items:center;justify-content:center;font-size:22px;font-weight:700}.numw input{width:130px;font:800 34px system-ui;text-align:center;padding:10px;border:3px solid #1b2a4a44;border-radius:14px}.numw input.ok{border-color:#1f8a55}.numw input.bad{border-color:#d1435b}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 18px 20px;background:linear-gradient(transparent,#f3efe2 30%);display:flex;justify-content:center}
.btn{display:block;width:100%;max-width:520px;padding:16px;border-radius:14px;font-weight:900;font-size:18px;letter-spacing:1px;background:#1b2a4a;color:#fff;border-bottom:4px solid #000}
.btn.go{background:#b0157a;border-color:#6d0b4b}.btn.soft{background:#fff;color:#1b2a4a;border:2px solid #1b2a4a33;border-bottom-width:4px}.btn.done{background:#1f8a55;border-color:#125c37}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{width:auto;padding:10px 14px;font-size:15px;flex:none}
.fb{position:fixed;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .25s;z-index:5}.fb.on{transform:none}
.fbin{max-width:760px;margin:0 auto;padding:16px 18px 20px;border-radius:18px 18px 0 0;display:grid;gap:6px}
.fb.good .fbin{background:#0f1b33;color:#e6f1ff;border-top:5px solid #5ef2c0}.fb.bad .fbin{background:#2a1520;color:#ffe9ee;border-top:5px solid #ff7d93}
.tw{font:800 15px ui-monospace,Menlo,monospace;letter-spacing:1px}.good .tw{color:#5ef2c0}.bad .tw{color:#ff9aac}.tw em{font-style:normal;color:#ffd166;margin-left:6px}
.fbin p{font-size:15px}.fbin small{opacity:.65;font-size:12px}.fbin .btn{margin-top:6px}
.mid{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px 20px 28px;text-align:center}
.mid h1{font-size:26px}.big{font-size:64px}.pop{animation:bump .5s}.sm{font-size:13px;opacity:.7}.need{font-weight:700;color:#b0157a}
.row2{display:flex;gap:10px;width:100%;max-width:520px}.link{text-decoration:underline;font-weight:700;opacity:.7;padding:6px}
.log{width:100%;max-width:440px;background:#fffdf5;border:2px solid #1b2a4a;border-radius:6px;padding:14px 18px;background-image:repeating-linear-gradient(#fffdf5 0 33px,#cfe0f0 33px 34px);text-align:left;box-shadow:5px 5px 0 #1b2a4a22}
.lh{font:800 13px ui-monospace,Menlo,monospace;letter-spacing:2px;color:#b0157a;border-bottom:2px solid #b0157a;padding-bottom:6px;margin-bottom:4px}
.lr{display:flex;justify-content:space-between;height:34px;align-items:center}.lr span{opacity:.7}.cash{color:#1f8a55}
.stars{display:flex;justify-content:center;gap:10px;font-size:46px;color:#c9c0a8;padding:4px 0}.st.on{color:#ffb703;animation:bump .4s}
.spec{width:100%;max-width:440px;background:#fff;border-radius:14px;padding:12px 16px;border:2px solid #1b2a4a1a;display:grid;gap:8px}.sh{font-size:13px;font-weight:700;opacity:.6;text-align:left}
.sr{display:grid;grid-template-columns:84px 1fr 42px;align-items:center;gap:8px;text-align:left;font-size:14px;font-weight:700}.sr b{text-align:right}.sr b.g{color:#1f8a55}.sr b.r{color:#d1435b}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}.bar i{height:12px;border-radius:3px;background:#1b2a4a14}.bar i.f{background:#1ca3ec}.bar i.need{outline:2px solid #b0157a;outline-offset:1px}
.gate{max-width:440px;background:#fff4d6;border:2px solid #e09a00;border-radius:12px;padding:10px 14px;font-size:15px}.gate small{display:block;opacity:.6}
.tabs{display:flex;background:#fff;border-radius:12px;padding:3px;border:2px solid #1b2a4a1a}.tabs button{padding:7px 14px;border-radius:9px;font-weight:800}.tabs .on{background:#1b2a4a;color:#fff}
.hang{justify-content:flex-start}.pc{display:flex;align-items:center;gap:8px;width:100%;max-width:440px}.pcm{flex:1}.pcm small{opacity:.6}
.arw{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid #1b2a4a22;font-size:18px}
.parts{display:grid;gap:10px;width:100%;max-width:460px}.part{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px;text-align:left;border:2px solid #1b2a4a1a}.part>div{flex:1}.part small{display:block;opacity:.65}.pi{font-size:30px}
.res{flex:1;overflow:auto;padding:16px 18px 100px;display:flex;flex-direction:column;align-items:center;gap:14px}.score{font-size:60px;font-weight:900;text-align:center}.g{color:#1f8a55}.r{color:#d1435b}.pg,.pr{text-align:center;font-weight:800}
.rev{width:100%;max-width:560px;display:grid;gap:8px}.ri{background:#fff;border-radius:12px;padding:12px;border-left:5px solid}.ri.g{border-color:#1f8a55}.ri.r{border-color:#d1435b}.ri p{font-size:14px}.ri .w{opacity:.75}.ri small{opacity:.55}
.coin{position:fixed;z-index:20;width:26px;height:26px;margin:-13px;border-radius:50%;background:#ffd166;border:3px solid #e09a00;color:#8a5a00;font:900 14px/20px system-ui;text-align:center;transition:transform .55s cubic-bezier(.5,-0.3,.7,1),opacity .55s;pointer-events:none}

.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:30;animation:fall 1.8s ease-in forwards;pointer-events:none}@keyframes fall{to{top:105vh;transform:rotate(720deg)}}
body.pulse #app{animation:pulse .3s}@keyframes pulse{40%{transform:scale(1.012);filter:brightness(1.06)}}

#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

.stick{position:absolute;bottom:26px;left:50%;margin-left:-62px;width:124px;height:124px;border-radius:50%;background:#ffffff40;border:3px solid #ffffff99;touch-action:none;display:grid;place-items:center}.stick i{width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0005}

 coffee.",q:"Which is part of the sUAS, but not the aircraft?",o:["The battery","The control station","The prop guards"],a:1,why:"The control station is part of the system (sUAS). The battery and guards ride on the aircraft.",c:"14 CFR 107.3"},{t:"num",s:"A rig weighs 54 lb with its camera.",q:"Add a 2 lb gimbal. New takeoff weight: ___ lb.",a:56,u:"lb",why:"Everything attached counts: 54 + 2 = 56 lb. That's no longer a small UA.",c:"14 CFR 107.3"},{t:"call",s:"A 0.4 lb toy drone, flown only for fun.",q:"Must it be registered?",o:["Yes","No"],a:1,why:"Recreational-only and 0.55 lb or less: registration isn't required.",c:"14 CFR 48.15"},{t:"mc",s:"A client sees the drone label.",q:"The registration number must be\u2026",o:["Legible on an external surface","Engraved on the motor","Stored in the app only"],a:0,why:"Legible, on an external surface of the aircraft.",c:"14 CFR 48.205"},{t:"num",s:"Registered Jan 2025.",q:"It expires in Jan 20__.",a:28,u:"",why:"Registration lasts 3 years: 2025 + 3 = 2028.",c:"14 CFR 48.100(c)"},{t:"tf",s:"You changed your email last week.",q:"You have 30 days to update your registration.",a:1,why:"Changes must be updated within 14 calendar days.",c:"14 CFR 48.115(b)"},{t:"mc",s:"Marcus passed the test in May 2024.",q:"He's current through the end of\u2026",o:["May 2025","May 2026","May 2027"],a:1,why:"24 calendar months: through the end of May 2026.",c:"14 CFR 107.65"},{t:"call",s:"Dana asks you to fly while Rosa naps in the van.",q:"You have no certificate. Fly?",o:["Fly","Don't fly"],a:1,why:"Without direct supervision you can't fly. Rosa must be able to take control right away.",c:"14 CFR 107.12(a)(2)"},{t:"mc",s:"The crew disagrees about one more pass.",q:"Who makes the final call?",o:["The client","The Remote PIC","The visual observer"],a:1,why:"The Remote PIC is the final authority on the flight.",c:"14 CFR 107.19(b)"},{t:"tf",s:"Rosa names herself on the plan.",q:"The Remote PIC must be designated before or during the flight.",a:0
